name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/compose.production.yaml"
      - "deploy/nas/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cassist
          POSTGRES_USER: cassist
          POSTGRES_PASSWORD: cassist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cassist -d cassist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q --cov --cov-report=term-missing
      - name: Validate production Compose configuration
        working-directory: deploy
        run: docker compose --env-file .env.production.example --file compose.production.yaml config --quiet
        env:
          CASSIST_ENV_FILE: .env.production.example
      - name: Check self-hosted deployment scripts
        working-directory: .
        run: |
          shellcheck deploy/nas/cassist-deploy-backend
          shellcheck deploy/nas/cassist-current-backend-image
          shellcheck deploy/nas/cassist-deploy-dispatch
