name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cassist-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cassist
          POSTGRES_USER: cassist
          POSTGRES_PASSWORD: cassist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cassist -d cassist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Test backend
        working-directory: backend
        run: |
          uv sync --locked --dev
          uv run alembic upgrade head
          uv run ruff check .
          uv run pytest -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish immutable backend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ vars.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Join the private deployment network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure pinned deployment SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/cassist_deploy
          chmod 600 ~/.ssh/cassist_deploy
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy API and conditionally enabled worker
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DEPLOY_IMAGE: ${{ vars.BACKEND_IMAGE }}@${{ steps.build.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_SSH_USER"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh \
            -i ~/.ssh/cassist_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            sudo /usr/local/sbin/cassist-deploy-backend "$DEPLOY_IMAGE" "$REGISTRY_USERNAME"
      - name: Verify deployed image and public readiness
        env:
          DEPLOY_IMAGE: ${{ vars.BACKEND_IMAGE }}@${{ steps.build.outputs.digest }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          PUBLIC_READY_URL: ${{ vars.PUBLIC_READY_URL }}
        run: |
          actual_image="$(ssh -i ~/.ssh/cassist_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            sudo /usr/local/sbin/cassist-current-backend-image)"
          test "$actual_image" = "$DEPLOY_IMAGE"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$PUBLIC_READY_URL" >/dev/null
