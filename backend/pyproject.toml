[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cassist-backend"
version = "0.1.0"
description = "CAssist document-processing API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "authlib>=1.7.2",
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "openai>=2.0",
  "Pillow>=12.3,<13",
  "pydantic-settings>=2.7",
  "pypdfium2>=5.12,<6",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0",
  "strands-agents[gemini]>=1.0",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
cassist-worker = "app.workers.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
