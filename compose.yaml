services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cassist
      POSTGRES_USER: cassist
      POSTGRES_PASSWORD: cassist
    ports:
      - "5432:5432"
    volumes:
      - cassist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassist -d cassist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cassist_postgres_data:
