x-backend: &backend
  image: cassist-backend:${CASSIST_IMAGE_TAG:-latest}
  build:
    context: ../backend
  env_file:
    - .env.production
  networks:
    - cassist_internal
    - cassist_egress
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cassist
      POSTGRES_USER: cassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    networks:
      - cassist_internal
    volumes:
      - cassist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassist -d cassist"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "1.50"
    mem_limit: 2g
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  migrate:
    <<: *backend
    profiles: ["ops"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/api/v1/ready', headers={'X-CAssist-Proxy-Secret': os.environ['EDGE_PROXY_SECRET']});
          urllib.request.urlopen(request, timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
    stop_grace_period: 30s

  worker:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["cassist-worker"]
    cpus: "2.50"
    mem_limit: 3g
    mem_reservation: 512m
    stop_grace_period: 180s

networks:
  cassist_internal:
    driver: bridge
    internal: true
  cassist_egress:
    driver: bridge

volumes:
  cassist_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CASSIST_POSTGRES_DATA_PATH:?Set the NAS NVMe PostgreSQL path}
