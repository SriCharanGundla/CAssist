name: cassist

x-backend: &backend
  image: ${CASSIST_BACKEND_IMAGE:-cassist-backend:latest}
  build:
    context: ../backend
  env_file:
    - ${CASSIST_ENV_FILE:-.env.production}
  networks:
    - cassist_internal
    - cassist_egress
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cassist
      POSTGRES_USER: cassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    networks:
      - cassist_internal
    volumes:
      - cassist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassist -d cassist"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "1.50"
    mem_limit: 2g
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  migrate:
    <<: *backend
    profiles: ["ops"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/api/v1/ready', headers={'X-CAssist-Proxy-Secret': os.environ['EDGE_PROXY_SECRET']});
          urllib.request.urlopen(request, timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
    stop_grace_period: 30s

  worker:
    <<: *backend
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["cassist-worker"]
    cpus: "2.50"
    mem_limit: 3g
    mem_reservation: 512m
    stop_grace_period: 180s

  backup:
    profiles: ["ops"]
    build:
      context: ./backup
    image: cassist-backup:${CASSIST_IMAGE_TAG:-latest}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: cassist
      PGUSER: cassist
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      RESTIC_REPOSITORY: s3:${R2_ENDPOINT_URL:?Set R2_ENDPOINT_URL}/${R2_BACKUP_BUCKET_NAME:?Set R2_BACKUP_BUCKET_NAME}/${R2_BACKUP_PREFIX:-postgresql/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in deploy/.env.production}
      RESTIC_HOST: cassist-production
      RESTIC_TAG: cassist-postgresql
      RESTIC_KEEP_DAILY: "7"
      RESTIC_KEEP_WEEKLY: "4"
      RESTIC_KEEP_MONTHLY: "6"
      RESTIC_CACHE_DIR: /tmp/restic-cache
      AWS_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID:?Set R2_BACKUP_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY:?Set R2_BACKUP_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: auto
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cassist_internal
      - cassist_egress
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m

networks:
  cassist_internal:
    driver: bridge
    internal: true
  cassist_egress:
    driver: bridge

volumes:
  cassist_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CASSIST_POSTGRES_DATA_PATH:?Set the NAS NVMe PostgreSQL path}
